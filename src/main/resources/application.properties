spring.application.name=mortgage

# ── Base de datos H2 ────────────────────────────────────────────────────────
# Nombre fijo en memoria; DB_CLOSE_DELAY=-1 evita que se destruya al cerrar conexiones
spring.datasource.url=jdbc:h2:mem:banksdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Inicialización SQL ──────────────────────────────────────────────────────
# Forzar la ejecución explícita de schema.sql y data.sql al arrancar
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.platform=h2

# ── springdoc / OpenAPI ─────────────────────────────────────────────────────
# Load the hand-written spec instead of auto-generating it from annotations
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true

# ── Logs ────────────────────────────────────────────────────────────────────
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG