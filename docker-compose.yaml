services:
  db:
    image: postgres16-alpine
    container_name: banksproject-db
    restart: always
    environment:
      POSTGRES_DB: banks_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    volumes:
      - db_data:/var/lib/postgres/db_data
    networks:
      - app-network

  backend:
    build: .
    container_name: banksproject-app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/banks_db
      SPRING_DATASOURCE_NAME: bank_user
      SPRING_DATASOURCE_PASSWORD: bank_password
    networks:
      - app-network
    
  volumes:
    db_data:

  networks:
    app-network:
      driver: bridge  
    